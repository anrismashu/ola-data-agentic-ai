[project]
name = "ola-data-agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ken", email = "jeevanparihar69@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "grandalf>=0.8",
    "ipython>=9.17.1",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pyppeteer>=0.0.25",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[project.scripts]
ola-data-agentic-ai = "ola_data_agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
